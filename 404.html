<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Cloudflare Pages 找不到頁面時會用這個檔案回應任何路徑（例如 /a/b/c），所以用 base 讓所有相對路徑都從網站根目錄算 -->
<base href="/">
<title>找不到頁面 · 天空檔案 SKY ARCHIVE</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="assets/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#1565d8">
<link rel="stylesheet" href="css/style.css?v=204">
<link rel="stylesheet" href="css/sky.css?v=2">
<link rel="stylesheet" href="css/transition.css?v=6">
<script src="js/theme.js?v=134"></script>
<script src="js/i18n.js?v=211"></script>
<script src="js/skytime.js?v=2"></script>
<script src="js/transition.js?v=6"></script>
<script src="js/sitebar.js?v=201" defer></script>
<script src="js/extras.js?v=3" defer></script>
<style>
/* 「航班取消」404 頁：出發看板樣式（設計紀錄 docs/site-redesign.md 第 10 節） */
.nf-wrap{max-width:980px;margin:0 auto;padding:48px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px))}
.nf-board{position:relative;z-index:5;margin-top:-34px;background:#071a36;color:#eaf4ff;border-radius:18px;padding:18px 18px 10px;box-shadow:var(--shadow-hi)}
.nf-bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:2px 6px 14px}
.nf-bhead h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.08em}
.nf-bhead .site-clock{margin-left:auto;color:#eaf4ff;border-color:#1f4577}
.nf-row{display:grid;grid-template-columns:150px minmax(0,1fr) 60px 130px;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid #143766;text-decoration:none;color:#eaf4ff}
.nf-row.hdr{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#86a8d4;text-transform:uppercase;border-top:0;padding-block:4px 8px}
a.nf-row:hover{background:rgba(99,204,255,.09)}
.nf-tiles{display:flex;gap:2px}
.nf-tile{width:17px;height:26px;display:grid;place-items:center;background:#10305c;border-radius:3px;font-family:var(--mono);font-weight:600;font-size:14px;position:relative}
.nf-tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#071a36}
.nf-dest b{display:block;font-weight:600;font-size:15px}
.nf-dest span{display:block;font-size:12px;color:#86a8d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf-gate{font-family:var(--mono);font-weight:600}
.nf-stat{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;color:#5fe3b4}
.nf-stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.nf-stat.cancel{color:#ff8a65}
.nf-stat.cancel::before{animation:nf-blink 1.1s steps(2) infinite}
@keyframes nf-blink{50%{opacity:.15}}
.nf-cancel{background:rgba(255,138,101,.08)}
.nf-note{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.8}
.nf-note code{font-family:var(--mono);color:var(--amber);word-break:break-all}
@media (max-width:640px){
  .nf-row{grid-template-columns:minmax(0,1fr) 108px}
  .nf-row .nf-tiles{grid-column:1/-1}
  .nf-row .nf-gate,.nf-row.hdr{display:none}
}
@media (prefers-reduced-motion:reduce){ .nf-stat.cancel::before{animation:none} }
</style>
</head>
<body>
<div class="nf-wrap">
  <div class="fleet-head">
    <a class="eyebrow home-link" href="index.html">SKY ARCHIVE / 天空檔案 · ERROR 404</a>
    <h1 data-i18n="nf.title">這個航班找不到了</h1>
    <p data-i18n="nf.sub">你要找的頁面不存在，可能已經取消、改了班次，或網址打錯了。可以從下面的登機門改搭其他航班。</p>
  </div>

  <div class="nf-board">
    <div class="nf-bhead">
      <h2>DEPARTURES</h2>
      <button type="button" class="site-clock" data-skyclock="compact" data-tzpicker></button>
    </div>
    <div class="nf-row hdr"><span data-i18n="nf.col.flight">班次</span><span data-i18n="nf.col.dest">目的地</span><span data-i18n="nf.col.gate">登機門</span><span data-i18n="nf.col.status">狀態</span></div>
    <div class="nf-row nf-cancel">
      <span class="nf-tiles" aria-label="404"><span class="nf-tile">4</span><span class="nf-tile">0</span><span class="nf-tile">4</span></span>
      <span class="nf-dest"><b data-i18n="nf.lost">找不到的頁面</b><span id="nf-path"></span></span>
      <span class="nf-gate">—</span>
      <span class="nf-stat cancel" data-i18n="nf.cancelled">已取消</span>
    </div>
    <div id="nf-rows"></div>
  </div>

  <p class="nf-note" id="nf-note"></p>
  <div class="nf-tools"><button class="ed-entry" id="btn-lang" title="Language">繁中</button><button class="ed-entry" id="btn-theme" data-i18n-title="viewer.theme" title="切換主題" aria-label="切換主題" data-ico="sun"></button></div>
</div>

<script>
(function(){
  const t = k => I18N.t(k);
  const GATES = [
    ["SKY", "index.html", "home.pass.from", "nf.dest.home", "A0"],
    ["ACF", "fleet.html", "home.nav.fleet", "nf.dest.fleet", "A1"],
    ["APT", "airports.html", "home.nav.airports", "nf.dest.airports", "B2"],
    ["ALN", "airlines.html", "home.nav.airlines", "nf.dest.airlines", "C3"],
    ["KNW", "knowledge.html", "home.nav.knowledge", "nf.dest.knowledge", "D4"]
  ];
  const tiles = code => [...code].map(c => `<span class="nf-tile">${c}</span>`).join("");
  function render(){
    I18N.apply();
    document.title = `${t("nf.title")} · SKY ARCHIVE`;
    document.getElementById("nf-path").textContent = decodeURIComponent(location.pathname);
    document.getElementById("nf-rows").innerHTML = GATES.map(([code, href, nameKey, subKey, gate]) =>
      `<a class="nf-row" href="${href}"><span class="nf-tiles">${tiles(code)}</span><span class="nf-dest"><b>${t(nameKey)}</b><span>${t(subKey)}</span></span><span class="nf-gate">${gate}</span><span class="nf-stat">${t("nf.boarding")}</span></a>`).join("");
    document.getElementById("nf-note").textContent = t("nf.note");
  }
  render();
  document.addEventListener("langchange", render);
  I18N.mountSelector(document.getElementById("btn-lang"));
  document.getElementById("btn-theme").addEventListener("click", () => window.HangarTheme.toggle());
})();
</script>
</body>
</html>
