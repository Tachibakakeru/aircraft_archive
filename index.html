<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天空檔案 SKY ARCHIVE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="css/style.css?v=159">
<link rel="stylesheet" href="css/home.css?v=138">
<script src="js/theme.js?v=138"></script>
<script src="js/i18n.js?v=138"></script>
</head>
<body>

<div class="home-tools">
  <button class="tool-btn" id="btn-lang" title="Language">繁中</button>
  <button class="tool-btn" id="btn-theme" data-i18n-title="viewer.theme" title="切換主題">◐</button>
</div>

<div class="home-wrap">
  <div class="home-head">
    <div class="eyebrow" data-i18n="brand.eyebrow">SKY ARCHIVE / 天空檔案</div>
    <h1 data-i18n="home.title">歡迎光臨天空檔案</h1>
    <div class="sub" data-i18n="home.sub">選擇要探索的資料庫</div>
  </div>

  <div class="home-modes">
    <a class="home-card" href="fleet.html">
      <span class="icon">✈️</span>
      <h2 data-i18n="home.fleet.title">飛行器圖鑑</h2>
      <p data-i18n="home.fleet.desc">52 款機型的 3D 互動檢視、規格比對與家族系譜</p>
      <span class="stat" id="stat-aircraft">— AIRCRAFT</span>
    </a>
    <a class="home-card" href="airports.html">
      <span class="icon">🛬</span>
      <h2 data-i18n="home.airports.title">機場與跑道</h2>
      <p data-i18n="home.airports.desc">全球機場搜尋、跑道明細與 ICAO／IATA 代號</p>
      <span class="stat" id="stat-airports">— AIRPORTS</span>
    </a>
    <a class="home-card" href="airlines.html">
      <span class="icon">🏢</span>
      <h2 data-i18n="home.airlines.title">全球航空公司</h2>
      <p data-i18n="home.airlines.desc">公司資訊、機隊組成與代表性航線</p>
      <span class="stat" id="stat-airlines">— AIRLINES</span>
    </a>
    <a class="home-card" href="knowledge.html">
      <span class="icon">💡</span>
      <h2 data-i18n="home.knowledge.title">航空小知識</h2>
      <p data-i18n="home.knowledge.desc">互動座艙儀表面板與飛航冷知識，點一點就懂</p>
      <span class="stat" id="stat-topics">— TOPICS</span>
    </a>
  </div>

  <div class="home-foot" data-i18n="home.foot">SKY ARCHIVE — 飛行器與機場的互動資料庫</div>
</div>

<script>
I18N.apply();
I18N.mountSelector(document.getElementById("btn-lang"));
document.getElementById("btn-theme").addEventListener("click", () => window.HangarTheme.toggle());
document.addEventListener("langchange", () => I18N.apply());

(async () => {
  const fmt = n => n.toLocaleString();
  const topicCount = knowledge => {
    const ids = new Set(knowledge.topics.map(t => t.id));
    try { JSON.parse(localStorage.getItem("hangar_knowledge_custom") || "[]").forEach(t => ids.add(t.id)); } catch {}
    return ids.size;
  };
  const [fleet, airlines, airports, knowledge] = await Promise.all([
    fetch("data/fleet.json?v=168").then(r => r.json()),
        fetch("data/airlines.json?v=139").then(r => r.json()),
    fetch("data/airport_count.json?v=138").then(r => r.json()),
    fetch("data/knowledge.json?v=161").then(r => r.json()),
  ]);
  document.getElementById("stat-aircraft").textContent = `${fmt(fleet.aircraft.length)} AIRCRAFT`;
  document.getElementById("stat-airports").textContent = `${fmt(airports.count)} AIRPORTS`;
  document.getElementById("stat-airlines").textContent = `${fmt(airlines.airlines.length)} AIRLINES`;
  const updateTopics = () => document.getElementById("stat-topics").textContent = `${fmt(topicCount(knowledge))} TOPICS`;
  updateTopics();
  window.addEventListener("storage", e => { if (e.key === "hangar_knowledge_custom") updateTopics(); });
})();
</script>
</body>
</html>
